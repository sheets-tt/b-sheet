name: CodeQL

# Análisis de seguridad del CÓDIGO Java (no de dependencias) con CodeQL.
# El repo es público, así que CodeQL es gratis. Se enciende con la variable de repositorio
# CODEQL_ENABLED=true; el "Default setup" de Code scanning debe estar apagado o rechaza estos resultados.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"   # diario a las 13:00 UTC = 7:00 en Ciudad de México (UTC-6, sin horario de verano)
  workflow_dispatch:       # corrida manual desde Actions → CodeQL → Run workflow

permissions:
  contents: read

jobs:
  analyze:
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publicar resultados en Security → Code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilar
        run: ./mvnw -B -q compile -DskipTests
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
