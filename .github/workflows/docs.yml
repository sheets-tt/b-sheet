# Documentación con MkDocs (Material): las páginas de docs/ incluyen secciones del README.
# - En cada PR y push que toque la documentación: `mkdocs build --strict` (falla con enlaces o
#   configuración rotos).
# - Publicación en GitHub Pages solo desde main y solo si la variable de repositorio DOCS_PAGES es
#   "true" (Settings → Pages → Source: GitHub Actions). Sin ella, el workflow solo valida.
name: Documentación

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "docs_hooks.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "docs_hooks.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
