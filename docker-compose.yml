# Base de datos con Flyway en Docker.
#
#   docker compose up -d db               # Postgres 17 local (puerto 5434 por defecto)
#   docker compose run --rm flyway        # aplica las migraciones (db/migration) y muestra el estado
#
# Contra una base existente (p.ej. el Postgres externo de producción), sin levantar "db":
#   FLYWAY_URL='jdbc:postgresql://host:5432/sheets?sslmode=require' FLYWAY_USER=... FLYWAY_PASSWORD=... \
#     docker compose run --rm --no-deps flyway
#
# Otros comandos: docker compose run --rm flyway info | validate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sheets
      POSTGRES_USER: ${DB_USER:-sheets}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sheets}
    ports:
      - "${DB_PORT:-5434}:5432"   # 5432 y 5433 ya están ocupados en esta máquina
    volumes:
      - sheets-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    # Misma versión de Flyway que usa el backend (micronaut-flyway 4.10.20 -> Flyway 10.22.0).
    image: flyway/flyway:10.22.0-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://db:5432/sheets}
      FLYWAY_USER: ${FLYWAY_USER:-sheets}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-sheets}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    entrypoint: ["flyway"]
    command: ["migrate", "info"]

volumes:
  sheets-db:
