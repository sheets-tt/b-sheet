micronaut:
  application:
    name: sheets-backend
  security:
    authentication: bearer
    # Usamos nuestro propio AuthController en /auth/login.
    endpoints:
      login:
        enabled: false
      logout:
        enabled: false
    token:
      generator:
        access-token:
          expiration: 3600
      jwt:
        signatures:
          # No usamos JWKS remotos; sin esto el handler Lambda (que inicializa singletons
          # de forma eager) falla porque no hay implementación de HttpClient en el jar.
          jwks-client:
            http-client:
              enabled: false
          secret:
            generator:
              # HS256, >= 32 caracteres. Obligatorio (sin default fuera de dev/test).
              secret: ${JWT_SECRET}
              jws-algorithm: HS256
  server:
    port: ${PORT:8080}
    context-path: ${CONTEXT_PATH:}
    cors:
      enabled: true
      configurations:
        web:
          # Lista separada por comas, p.ej. "http://localhost:5173,https://app.example.com"
          allowed-origins: ${CORS_ALLOWED_ORIGINS:`http://localhost:5173`}
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - Authorization
            - Content-Type

datasources:
  default:
    # BD externa a AWS. En producción usar SSL: ...?sslmode=require (o verify-full + sslrootcert)
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/sheets`}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    # Lambda: 1 request concurrente por instancia => pool mínimo y timeouts cortos.
    maximum-pool-size: 2
    minimum-idle: 0
    connection-timeout: 5000
    validation-timeout: 2000
    idle-timeout: 60000
    max-lifetime: 300000
    keepalive-time: 0
    initialization-fail-timeout: -1
    pool-name: sheets-pool
    # Requerido por micronaut-crac: suspende el pool antes del snapshot de SnapStart
    # y descarta conexiones viejas al restaurar.
    allow-pool-suspension: true

flyway:
  datasources:
    default:
      enabled: ${FLYWAY_ENABLED:true}
      locations: classpath:db/migration

# micronaut-management llega transitivamente; su /health chocaría con HealthController.
endpoints:
  all:
    enabled: false
