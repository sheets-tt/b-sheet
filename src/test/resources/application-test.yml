micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: test-only-secret-0123456789abcdefghijklmnop
datasources:
  default:
    url: ${DB_TEST_URL:`jdbc:postgresql://localhost:5432/sheets_test`}
# db/demo (cuenta demo@sheets.tt) solo en tests y dev; producción usa únicamente db/migration.
flyway:
  datasources:
    default:
      locations:
        - classpath:db/migration
        - classpath:db/demo
